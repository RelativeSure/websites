# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation
---
# all, none, or list of linter keys
APPLY_FIXES: all

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# ENABLE:

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
# ENABLE_LINTERS:

DISABLE_LINTERS:
  - ACTION_ZIZMOR
  - CSS_STYLELINT
  - HTML_DJLINT
  - PYTHON_FLAKE8
  - PYTHON_MYPY
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_CHECKOV
  - REPOSITORY_GRYPE
  - REPOSITORY_GITLEAKS
  - REPOSITORY_GIT_DIFF
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_SECRETLINT
  - REPOSITORY_TRIVY
  - TYPESCRIPT_STANDARD

DISABLE:
  - COPYPASTE # Comment to enable checks of excessive copy-pastes
  - SPELL # Comment to enable checks of spelling mistakes

# GITHUB_TOKEN is never allowed to push changes to files under
# .github/workflows/ (GitHub blocks this regardless of granted
# permissions, to prevent workflow privilege escalation), so exclude it
# from MegaLinter's fix/lint scope to avoid create-pull-request failures
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .github/workflows

# pnpm writes lockfiles with single-quoted keys; the YAML formatter defaults
# to double quotes, so without this exclusion every Renovate lockfile update
# gets "fixed" back and forth, producing pointless diffs and PR conflicts.
YAML_PRETTIER_FILTER_REGEX_EXCLUDE: "pnpm-lock\\.yaml"

SHOW_ELAPSED_TIME: true

FILEIO_REPORTER: false
# Uncomment if you want MegaLinter to detect errors but not block CI to pass
# DISABLE_ERRORS: true

# Activate SARIF for GitHub Security
SARIF_REPORTER: true
